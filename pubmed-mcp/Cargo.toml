[package]
name = "pubmed-mcp"
version.workspace = true
authors.workspace = true
categories = ["science", "api-bindings"]
edition.workspace = true
keywords = ["pubmed", "mcp", "biomedical", "literature", "api"]
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "MCP (Model Context Protocol) server for PubMed and PMC APIs"

[dependencies]
# Workspace dependencies
anyhow.workspace = true
pubmed-client = { workspace = true, features = ["storage-s3"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# MCP Server dependencies
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
tempfile = "3"
wiremock = "0.6"

[[bin]]
name = "pubmed-mcp"
path = "src/main.rs"

[lints]
workspace = true
