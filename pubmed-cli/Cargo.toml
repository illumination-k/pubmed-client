[package]
name = "pubmed-cli"
version.workspace = true
authors.workspace = true
categories = ["command-line-utilities", "api-bindings", "science"]
edition.workspace = true
keywords = ["pubmed", "cli", "biomedical", "research", "pmc"]
license.workspace = true
repository.workspace = true
description = "Command-line interface for PubMed and PMC APIs"

[[bin]]
name = "pubmed-cli"
path = "src/main.rs"

[dependencies]
# Core library
pubmed-client = { workspace = true, features = ["storage-s3"] }

# CLI framework
clap = { version = "4.0", features = ["derive", "env", "string"] }

# Async runtime
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress indicators
indicatif = { version = "0.18", features = ["rayon"] }
tracing-indicatif = "0.3"

# Temporary files
tempfile = "3.8"

[dev-dependencies]
# Testing utilities
tempfile = "3.8"
tokio-test = "0.4"

[lints]
workspace = true
