name: "CI / Go"

on:
  push:
    branches: [main]
    paths:
      - "pubmed-client-go/**"
      - "pubmed-client/src/**"
      - "pubmed-client/Cargo.toml"
      - "pubmed-parser/**"
      - "pubmed-formatter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.go.toml"
      - ".github/workflows/ci-go.yml"
      - ".github/actions/setup-repo/**"
  pull_request:
    branches: [main]
    paths:
      - "pubmed-client-go/**"
      - "pubmed-client/src/**"
      - "pubmed-client/Cargo.toml"
      - "pubmed-parser/**"
      - "pubmed-formatter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.go.toml"
      - ".github/workflows/ci-go.yml"
      - ".github/actions/setup-repo/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MISE_ENV: go

permissions:
  contents: read

jobs:
  # Formatting and vet are platform-independent, so they run once. `go vet`
  # still needs the static archive because the package is cgo.
  lint:
    name: gofmt and go vet
    # Local: MISE_ENV=go mise run lint:go
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pubmed-client-go

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup repository environment
        uses: ./.github/actions/setup-repo

      - name: Check formatting and vet
        run: make check

  # Both hosts are covered because the cgo link line differs per platform:
  # Linux needs -lm/-ldl/-lpthread, macOS needs the CoreFoundation/Security
  # frameworks. A missing flag only shows up at link time.
  test:
    name: Test (${{ matrix.os }})
    # Local: MISE_ENV=go mise run go:test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: pubmed-client-go

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup repository environment
        uses: ./.github/actions/setup-repo

      # Offline: the end-to-end tests drive a local httptest server through the
      # client's BaseURL override, so no NCBI traffic is involved.
      - name: Run tests
        run: make test

      - name: Build the example
        run: go build ./examples/...
