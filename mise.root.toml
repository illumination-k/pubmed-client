# Loaded with MISE_ENV=root
# Repository infrastructure tools: formatting, linting, CI auditing
# Used by: lint.yml, and local development

[tools]
prek = "latest"
dprint = "latest"
shfmt = "3"
actionlint = "1.7.7"
"pipx:zizmor" = "1.29.0"
shellcheck = "0.10.0"
"aqua:suzuki-shunsuke/ghalint" = "1.4.1"
"aqua:suzuki-shunsuke/pinact" = "3.3.0"
"github:illumination-k/agent-lens" = { version = "rolling", prerelease = true }
# ── Format tasks ──────────────────────────────────────────────────────────────

[tasks."fmt:root"]
description = "Format Rust code (dprint + cargo fmt + pinact)"
run = ["mise fmt", "dprint fmt"]

[tasks."fmt:sh"]
description = "Format shell scripts with shfmt"
run = ["shfmt -w ./**/*.sh"]

[tasks."lint:root"]
description = "Lint Rust and GitHub Actions (dprint, clippy, actionlint, ghalint, zizmor)"
# zizmor is scoped to .github rather than the repo root: the root also holds
# .pre-commit-config.yaml, which zizmor collects and then fails to parse because
# prek's `repo: builtin` is not a repo kind upstream pre-commit (and so zizmor's
# schema) knows about — a fatal error that aborts the whole audit. Everything
# zizmor audits (workflows + composite actions) lives under .github anyway.
run = ["actionlint", "ghalint run", "zizmor .github", "dprint check"]
