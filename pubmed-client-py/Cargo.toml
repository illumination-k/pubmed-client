[package]
name = "pubmed-client-py"
version.workspace = true
authors.workspace = true
categories = ["api-bindings", "science", "web-programming::http-client"]
edition.workspace = true
keywords = ["pubmed", "python", "pyo3", "biomedical", "api"]
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Python bindings for the PubMed client library"

[lib]
name = "pubmed_client_py"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
pubmed-client = { workspace = true }

# PyO3 for Python bindings
pyo3 = { version = "0.28.2" }

# pyo3-stub-gen for automatic type stub generation
# These must stay compatible with the pyo3 version above.
# pyo3-stub-gen 0.19.x targets pyo3 0.28.x; update them together.
pyo3-stub-gen = "0.19"
pyo3-stub-gen-derive = "0.19"

# Re-export some core dependencies
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
doc = false

[features]
default = []
# Enabled by maturin when building the wheel (see `[tool.maturin] features` in
# pyproject.toml). It must stay OFF for `cargo test`/`cargo run`: with
# `extension-module` pyo3 omits the libpython link flags, so every non-cdylib
# target (test harnesses, the `stub_gen` binary) fails to link with undefined
# Py* symbols unless the linker happens to discard all pyo3 objects as dead.
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
