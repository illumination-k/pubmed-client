# Loaded with MISE_ENV=rust
# Rust-specific test tooling and workspace tasks
# Used by: rust.yml, integration-tests.yml

# cargo-binstall is fetched via aqua (prebuilt) and acts as the installer for
# the cargo: tools below — mise picks it up automatically when present, so
# nextest/llvm-cov download prebuilt binaries instead of compiling from source.
[tools]
"aqua:cargo-bins/cargo-binstall" = "latest"

[tools."cargo:cargo-nextest"]
version = "latest"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-llvm-cov"]
version = "latest"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tasks."fmt:rs"]
description = "Format Rust code with cargo fmt"
run = ["cargo fmt --all"]

[tasks."lint:rs"]
description = "Lint Rust code with cargo clippy"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks."test:rs"]
description = "Run tests for entire workspace using nextest"
run = ["cargo nextest run --workspace"]

[tasks."test:rs:cache-backends"]
description = "Run pubmed-client tests with the optional cache backends enabled"
# `test:rs` builds with default features, so the `cache-redis` / `cache-sqlite`
# code is not even compiled there. Only the coverage job (`--all-features`) used
# to reach it, which meant a broken backend could pass the Test Suite job.
run = ["cargo nextest run -p pubmed-client --features cache-sqlite,cache-redis"]

[tasks."doctest:rs"]
description = "Run doc tests for entire workspace"
run = ["cargo test --doc --workspace --exclude pubmed-client-py"]

[tasks."build:rs"]
description = "Build entire workspace"
run = ["cargo build --workspace"]

[tasks."check:rs"]
description = "Check entire workspace without building"
run = ["cargo check --workspace"]

[tasks."coverage:rs"]
description = "Generate HTML coverage report (llvm-cov)"
run = [
  # pubmed-client-py is excluded for the same reason as `doctest:rs`: with
  # `--all-features` its `extension-module` feature is on, so pyo3 omits the
  # libpython link flags and its test harnesses fail to link.
  "cargo llvm-cov nextest --workspace --exclude pubmed-client-py --all-features --no-report",
  "cargo llvm-cov report --html",
  "cargo llvm-cov report --text",
]

[tasks."bench:rs"]
description = "Run all pubmed-parser criterion benchmarks"
run = ["cargo bench -p pubmed-parser"]

[tasks."bench:save"]
description = "Run benchmarks and save as a named baseline (usage: mise r bench:save <name>)"
run = "cargo bench -p pubmed-parser -- --save-baseline {{arg(i=0, name='baseline_name')}}"

[tasks."bench:compare"]
description = "Run benchmarks comparing against a saved baseline (usage: mise r bench:compare <name>)"
run = "cargo bench -p pubmed-parser -- --baseline {{arg(i=0, name='baseline_name')}}"

[tasks."profile:rs"]
description = "Build and profile parsing with samply (usage: mise r profile:rs [pmc|pubmed|all])"
run = """
cargo build --profile profiling --example profile_parsing -p pubmed-parser
samply record target/profiling/examples/profile_parsing {{arg(i=0, name='mode', default='all')}}
"""

[tasks."ci:rs"]
description = "Equivalent to rust.yml: unit tests + doc tests"
depends = ["lint:rs", "test:rs", "test:rs:cache-backends", "doctest:rs"]
